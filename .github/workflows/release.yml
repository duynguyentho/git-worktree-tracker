name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" app/build.sh --release

      - name: Smoke test
        run: |
          lipo -archs app/build/Worktrees.app/Contents/MacOS/Worktrees
          /usr/bin/python3 app/build/Worktrees.app/Contents/Resources/wt.py list --json --offline > /dev/null
          codesign --verify --verbose app/build/Worktrees.app

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Worktrees $V" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "app/build/Worktrees-$V.zip" "app/build/Worktrees-$V.zip.sha256" --clobber
